<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Architecture Map — Edoc-Soummam (v4)</title>
<style>
  :root {
    --bg: #0F0F0F;      --panel: #161616;
    --panel-2: #1c1c1c; --border: #2a2a2a;
    --text: #e8e8e8;    --muted: #8a8a8a;
    --client: #4ea1ff;  --route: #7bd389;
    --service: #c792ea; --db: #ffb86b;
    --external: #ff6b9d;--critical: #ff3860;
    --accent: #f5b942;  --accent-2: #ff7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header#topbar { display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; z-index: 5;}
  header#topbar h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap;}
  header#topbar .sub { color: var(--muted); font-size:12px; }

  #chips { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .chip { padding:5px 12px; border-radius:999px; font-size:12px; cursor:pointer;
    border:1px solid var(--border); background:var(--panel-2); color:var(--muted);
    white-space:nowrap; transition: all .12s ease; user-select:none;}
  .chip:hover { border-color:#555; color:var(--text); }
  .chip.active { background: var(--accent); color:#161616; border-color:var(--accent); font-weight:600;}

  #zoomctl { display:flex; gap:4px; }
  #zoomctl button { width:26px; height:26px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer; font-size:14px; line-height:1;}
  #zoomctl button:hover { background:#2a2a2a; }

  #main { flex:1; display:flex; min-height:0; }
  #canvas-wrap { flex:1; position:relative; overflow:hidden; cursor:grab; background:
    radial-gradient(circle at 1px 1px, #1d1d1d 1px, transparent 0) 0 0/22px 22px, var(--bg); }
  #canvas-wrap.dragging { cursor:grabbing; }
  svg#map { position:absolute; top:0; left:0; }

  .cluster-box { fill-opacity: 0.55; stroke-opacity:0.9; rx:14; }
  .cluster-label { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; fill:var(--muted); font-weight:700;}

  .node-rect { stroke-width:1.4px; cursor:pointer; transition: opacity .15s ease, filter .15s ease; }
  .node-rect.critical { stroke-width:2.2px; }
  .node-group.dimmed { opacity:0.14; }
  .node-group:hover .node-rect { filter: brightness(1.25); }
  .node-label { font-size:12.5px; font-weight:700; fill:var(--text); pointer-events:none; }
  .node-sub { font-size:10.5px; fill:var(--muted); pointer-events:none; }
  .node-dead { font-size:9.5px; fill:var(--critical); font-weight:700; pointer-events:none; }
  .node-new { font-size:9px; fill:#7bd389; font-weight:700; pointer-events:none; }

  .badge { pointer-events:none; }
  .badge-fix circle { fill:#1e9e5a; } .badge-fix text { fill:#eafff2; font-size:9px; font-weight:700; }
  .badge-bug circle { fill:#c0263f; } .badge-bug text { fill:#ffecef; font-size:9px; font-weight:700; }

  .edge-path { fill:none; transition: opacity .15s ease, stroke-width .15s ease; }
  .edge-path.dimmed { opacity:0.06; }
  .edge-label { font-size:9.5px; fill:var(--muted); pointer-events:none; }
  .edge-label.dimmed { opacity: 0.06; }

  #sidebar { width:370px; min-width:370px; border-left:1px solid var(--border); background:var(--panel);
    overflow-y:auto; padding:18px; }
  #sidebar h2 { font-size:15px; margin:0 0 4px 0; }
  #sidebar .path { font-size:11px; color:var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all; margin-bottom:14px; }
  #sidebar .role { font-size:12.5px; color:var(--text); margin-bottom:10px; line-height:1.5;}
  #sidebar .plain-box { background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:12.5px; line-height:1.55; margin-bottom:14px; }
  #sidebar .plain-box .lbl { color:var(--accent); font-size:10.5px; text-transform:uppercase; letter-spacing:1px;
    font-weight:700; margin-bottom:4px; display:block;}
  #sidebar ul.notes { margin:0 0 14px 0; padding-left:18px; font-size:12px; color:var(--muted); line-height:1.6;}
  #sidebar h3.section { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted);
    margin:16px 0 8px 0; border-top:1px solid var(--border); padding-top:12px;}
  #sidebar .edge-row { font-size:11.5px; padding:6px 8px; border-radius:6px; background:var(--panel-2);
    margin-bottom:5px; display:flex; justify-content:space-between; gap:8px;}
  #sidebar .edge-row .arrow { color: var(--muted); }
  #sidebar .bug-row, #sidebar .fix-row { font-size:11.5px; padding:7px 9px; border-radius:6px; margin-bottom:6px; }
  #sidebar .bug-row { background:rgba(255,56,96,0.12); border:1px solid rgba(255,56,96,0.35);}
  #sidebar .fix-row { background:rgba(123,211,137,0.1); border:1px solid rgba(123,211,137,0.3);}
  #sidebar .sev { font-weight:700; text-transform:uppercase; font-size:9.5px; margin-right:6px; padding:1px 6px; border-radius:4px;}
  .sev-high { background:#ff3860; color:#fff; } .sev-med { background:#f5b942; color:#222; } .sev-low { background:#555; color:#eee;}
  #sidebar .empty-hint { color:var(--muted); font-size:12.5px; line-height:1.6; }
  #sidebar .legend-row { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  #sidebar .dot { width:10px; height:10px; border-radius:3px; display:inline-block; }
  #sidebar .findings li { margin-bottom:9px; }
  #sidebar::-webkit-scrollbar { width:8px; } #sidebar::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>Edoc-Soummam <span class="sub">— architecture map (v4, actualisée)</span></h1>
    <div id="chips"></div>
    <div id="zoomctl">
      <button id="zoom-fit" title="Fit">⤢</button>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out">−</button>
    </div>
  </header>
  <div id="main">
    <div id="canvas-wrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <aside id="sidebar"></aside>
  </div>
</div>

<script>
// ===========================================================================
// DATA — clusters / nodes / edges (hand-positioned layout)
// ===========================================================================
const clusters = [
  { id: 'entry',    label: 'Client Entry',               x: 30,   y: 20, w: 190, h: 400 },
  { id: 'pages',    label: 'Pages / Views',                x: 250,  y: 20, w: 210, h: 790 },
  { id: 'engine',   label: 'Frontend Engine & Services',   x: 490,  y: 20, w: 240, h: 1200 },
  { id: 'routes',   label: 'Server Routes',                x: 760,  y: 20, w: 220, h: 760 },
  { id: 'services', label: 'Services (Java)',               x: 1010, y: 20, w: 200, h: 610 },
  { id: 'data',     label: 'Data & External',               x: 1240, y: 20, w: 230, h: 830 },
];

const N = (id, cluster, label, sub, x, y, w, h, color, opts = {}) => ({
  id, cluster, label, sub, x, y, w, h, color, ...opts
});

const nodes = [
  // --- Client Entry ------------------------------------------------------
  N('main-jsx', 'entry', 'main.jsx', 'React root + ErrorBoundary', 50, 60, 150, 70, 'client', {
    role: "Monte l'app React dans le DOM et intercepte les erreurs de rendu.",
    plain: "Le tout premier fichier exécuté dans le navigateur : il démarre l'application et affiche un écran de secours si quelque chose plante.",
    path: 'frontend/src/main.jsx',
    notes: ['Enveloppe <App/> dans une ErrorBoundary maison (ligne 9-32)', 'StrictMode activé'],
    tag: ['all', 'overview'],
  }),
  N('app-jsx', 'entry', 'App.jsx', 'Routeur (react-router-dom)', 50, 160, 150, 110, 'client', {
    role: "Déclare toutes les routes et enveloppe les pages dans le Layout partagé.",
    plain: "Le plan du site : selon l'URL tapée, il décide quelle page afficher (tableau de bord, liste, formulaire, consultation...).",
    path: 'frontend/src/App.jsx:17-33',
    notes: [
      "NOUVEAU : route '/view/:tableName/:id' ajoutée pour la consultation en lecture seule (ligne 26)",
      "Route '/create' toujours déclarée mais absente du menu Sidebar (lien mort)",
      "NETTOYAGE : l'import mort de DocumentsList a été retiré — confirmation qu'aucune route '/documents' n'a jamais été déclarée ici ; le composant DocumentsList.jsx reste sur le disque mais est désormais totalement orphelin (aucun import, aucune route)",
      "Toute URL non déclarée (dont '/documents') retombe sur le wildcard '*' → redirection vers '/' (Dashboard)",
    ],
    tag: ['all', 'overview', 'submit-flow', 'documents-list', 'schema-sync', 'employee-lookup', 'create-form', 'view-detail'],
    critical: true,
  }),
  N('layout-shell', 'entry', 'Layout / Sidebar / TopNav', 'Coquille visuelle commune', 50, 300, 150, 100, 'client', {
    role: "Affiche la barre latérale et l'en-tête, puis rend la page active via <Outlet/>.",
    plain: "Le cadre fixe (menu, logo, en-tête) qui entoure chaque page, comme le contour d'une fenêtre.",
    path: 'frontend/src/components/Layout.jsx',
    notes: [
      "⚠️ RÉGRESSION : le lien 'Mes Documents' (vers /documents) a été entièrement supprimé de Sidebar.jsx (pas juste commenté) — seul 'Tableau de bord' reste dans le menu",
      "Sidebar.jsx : lien 'Nouvelle Demande' vers /create toujours commenté",
      'TopNav.jsx : boutons notifications/réglages décoratifs, non connectés',
    ],
    tag: ['all', 'overview'],
  }),

  // --- Pages / Views -------------------------------------------------------
  N('dashboard', 'pages', 'Dashboard.jsx', 'Grille des types de documents', 270, 60, 170, 80, 'route', {
    role: "Liste les types de documents disponibles et navigue vers le gestionnaire du type choisi.",
    plain: "La page d'accueil : une grille de cartes, une par type de formulaire (congé, réquisition...).",
    path: 'frontend/src/pages/Dashboard.jsx',
    notes: ['Consomme useDocuments() pour la liste', "Clic carte → /document-manager/:schemaName"],
    tag: ['all', 'overview', 'documents-list'],
  }),
  N('documents-list', 'pages', 'DocumentsList.jsx', 'Table globale + filtres', 270, 170, 170, 110, 'route', {
    role: "Affiche tous les documents soumis, filtrables par type et recherche texte ; ouvre chaque document en lecture seule.",
    plain: "Un tableau récapitulatif de toutes les demandes déjà envoyées, avec une recherche, un filtre par type, et un bouton pour consulter chaque ligne.",
    path: 'frontend/src/pages/DocumentsList.jsx',
    notes: [
      "⚠️ AGGRAVÉ : la page est désormais totalement inaccessible, même en tapant /documents dans l'URL — App.jsx ne déclare plus aucune route vers ce composant (l'import a été retiré) ; toute tentative retombe sur le wildcard '*' → redirection vers '/'",
      "Le bouton 'Consulter' navigue vers /view/{table}/{doc.id} (ligne 194-198), la route dédiée à la lecture seule ; le nom de table est maintenant mémorisé au chargement (doc.tableName) plutôt que redéduit",
      "Encodage partiellement corrigé (une chaîne réparée), mais 'r├®cup├®ration', 's├®lectionner', 'trouv├®' etc. restent corrompus (lignes 15, 45, 78, 168)",
      "Sans type sélectionné, interroge toujours la table 'documents' qui n'existe pas (ligne 26)",
    ],
    tag: ['all', 'overview', 'documents-list', 'view-detail'],
  }),
  N('doc-type-manager', 'pages', 'DocumentTypeManager.jsx', 'Table par type de document', 270, 300, 170, 110, 'route', {
    role: "Charge le schéma local, synchronise la table MySQL en arrière-plan, puis affiche les enregistrements existants.",
    plain: "La page 'historique' pour UN type de document précis : elle montre les colonnes définies par son schéma et les lignes déjà en base.",
    path: 'frontend/src/pages/DocumentTypeManager.jsx',
    notes: [
      "CORRIGÉ : le bouton 'Consulter' navigue désormais vers /view/{schemaName}/{doc.id} (ligne 162-163), aligné avec DocumentsList.jsx",
      "Colonnes imbriquées (ex: 'periode') affichées comme [object Object] (pas d'aplatissement à l'affichage)",
    ],
    tag: ['all', 'overview', 'documents-list', 'schema-sync'],
  }),
  N('view-form', 'pages', 'ViewForm.jsx', 'Édition + Revue + Soumission', 270, 430, 170, 120, 'route', {
    role: "Orchestre le cycle de vie complet d'une soumission : chargement du schéma, rendu du formulaire, écran de relecture, puis insertion en base.",
    plain: "L'écran où l'utilisateur remplit réellement un formulaire, vérifie ses réponses, puis valide définitivement sa demande.",
    path: 'frontend/src/pages/ViewForm.jsx',
    notes: [
      "3 étapes : EDITING → REVIEW → SUCCESS",
      "Utilise 'schemaName' de l'URL comme nom de table (cohérent avec syncSchema)",
      "Ajoute statut: 'nouveau' avant l'insertion",
    ],
    tag: ['all', 'overview', 'submit-flow', 'schema-sync'],
    critical: true,
  }),
  N('document-view-page', 'pages', 'DocumentViewPage.jsx', 'Consultation lecture seule (NOUVEAU)', 270, 570, 170, 110, 'route', {
    role: "Charge en parallèle le schéma local et l'enregistrement MySQL via son ID, puis affiche le formulaire en lecture seule.",
    plain: "Le nouvel écran 'fiche détail' : il montre un document déjà soumis, tel quel, sans permettre de le modifier.",
    path: 'frontend/src/pages/DocumentViewPage.jsx',
    notes: [
      "Route : /view/:tableName/:id — nouvelle route ajoutée dans App.jsx",
      "Charge schéma + données EN PARALLÈLE via Promise.all (ligne 42-45)",
      "Bouton 'Retour' : utilise window.history.back() s'il y a un historique de navigation, avec repli sur /documents?type={tableName} sinon — ⚠️ ce repli mène désormais nulle part puisque /documents n'est plus une route déclarée (redirection vers '/' par le wildcard, perte du contexte)",
    ],
    tag: ['all', 'overview', 'view-detail'],
    critical: true,
  }),
  N('create-form', 'pages', 'CreateForm.jsx', "Éditeur de schéma brut (non lié au menu)", 270, 700, 170, 70, 'route', {
    role: "Permet de coller un JSON Schema à la main et de créer/altérer la table MySQL correspondante.",
    plain: "Un outil pour créer un nouveau type de formulaire en collant du JSON — mais aucun bouton du menu n'y mène plus.",
    path: 'frontend/src/pages/CreateForm.jsx',
    notes: ["Route /create existe (App.jsx) mais le lien de navigation est commenté dans Sidebar.jsx"],
    tag: ['all', 'create-form'],
  }),

  // --- Frontend Engine & Services -----------------------------------------
  N('use-documents-hook', 'engine', 'useDocuments()', 'Charge + valide le registre', 510, 50, 200, 80, 'service', {
    role: "Récupère /schema/registry.json puis valide chaque schéma référencé avant de l'exposer aux pages.",
    plain: "Va chercher la liste des types de documents disponibles et écarte silencieusement ceux dont le fichier est mal formé.",
    path: 'frontend/src/hooks/useDocuments.js',
    notes: ['Rejette un schéma si isValidSchemaStructure() renvoie false', "N'inclut que les schémas listés dans registry.json — voir proposition_promotion.json (bug)"],
    tag: ['all', 'overview', 'documents-list'],
  }),
  N('form-engine-orchestrator', 'engine', 'FormEngine (form-renderer/index.jsx)', "Orchestrateur du formulaire", 510, 150, 200, 110, 'service', {
    role: "Composant central : initialise les données, calcule la visibilité des champs, valide et construit le payload d'envoi. Réutilisé en mode édition ET en mode lecture seule.",
    plain: "Le cerveau du formulaire dynamique : il transforme un schéma JSON en formulaire vivant, avec ses règles de validation et de champs cachés. Il sert aussi à afficher un document déjà rempli, verrouillé.",
    path: 'frontend/src/features/form-engine/form-renderer/index.jsx',
    notes: [
      "NOUVEAU : en mode consultation (initialData fourni), un effet dédié reconstruit un mapping 'minuscule → clé camelCase du schéma' et normalise les données reçues de MySQL avant affichage (ligne 68-94) — corrige l'affichage des champs comme idEmploye qui reviennent en minuscules depuis la base",
      "⚠️ RÉGRESSION : envoie toujours 'num_doc' dans le payload, mais DefinitionRepository ne crée plus cette colonne (voir plus bas) — le problème des colonnes manquantes est réapparu",
    ],
    tag: ['all', 'overview', 'submit-flow', 'employee-lookup', 'view-detail'],
    critical: true,
  }),
  N('render-jsx', 'engine', 'render.jsx', 'Champs + EmployeLookup', 510, 280, 200, 100, 'service', {
    role: "Fabrique chaque contrôle de saisie et gère la recherche d'employé par matricule avec debounce.",
    plain: "Dessine chaque case du formulaire (texte, date, liste...) et, pour le champ 'employé', va chercher automatiquement son nom quand on tape son identifiant.",
    path: 'frontend/src/features/form-engine/form-renderer/render.jsx',
    notes: ['Debounce de 600ms avant recherche auto', 'AbortController pour annuler une recherche en cours'],
    tag: ['all', 'overview', 'submit-flow', 'employee-lookup'],
  }),
  N('json-parser', 'engine', 'jsonParser.ts', 'Schéma JSON → payload MySQL', 510, 400, 200, 110, 'service', {
    role: "Aplatit les propriétés imbriquées et déduit un type SQL pour chaque champ du schéma.",
    plain: "Traduit un schéma JSON (avec des champs parfois imbriqués) en une liste plate de colonnes MySQL avec leur type.",
    path: 'frontend/src/features/form-engine/parser/jsonParser.ts',
    notes: [
      "SYSTEM_COLUMNS = {id, num_doc, statut, created_at} exclues du payload ALTER — désormais cohérent : ces 4 colonnes sont bien créées par le backend",
      "Sépare les champs imbriqués avec '_' plutôt que '.' pour rester compatible SQL",
    ],
    tag: ['all', 'overview', 'submit-flow', 'create-form'],
    critical: true,
  }),
  N('validation-manager', 'engine', 'validationManager.ts', 'Validation Ajv + règles inter-champs', 510, 530, 200, 100, 'service', {
    role: "Compile le schéma avec Ajv, reconstruit un objet imbriqué pour la validation, et traduit les erreurs en français.",
    plain: "Vérifie que les réponses respectent les règles du formulaire (obligatoire, format email, dates cohérentes...) et explique les erreurs en français.",
    path: 'frontend/src/features/form-engine/validator/validationManager.ts',
    notes: ['Ajv en mode strict:false + coerceTypes:true', "Règle spéciale : date de fin ne peut précéder la date de début"],
    tag: ['all', 'overview', 'submit-flow'],
    critical: true,
  }),
  N('expression-evaluator', 'engine', 'expression-evaluator/index.js', 'Champs requis + visibilité conditionnelle', 510, 650, 200, 90, 'service', {
    role: "Calcule les champs requis et les états cachés/lecture-seule, y compris les règles conditionnelles allOf/if/then.",
    plain: "Décide quels champs sont obligatoires ou doivent apparaître/disparaître selon les réponses déjà données.",
    path: 'frontend/src/features/form-engine/expression-evaluator/index.js',
    notes: ["isValidSchemaStructure() exige $schema, $id, title, description ET documentType — plus strict que JsonParser.parse() qui ne vérifie que 'properties'"],
    tag: ['all', 'overview', 'submit-flow', 'documents-list'],
  }),
  N('field-registry', 'engine', 'register/index.js', 'Type de champ → contrôle HTML', 510, 760, 200, 80, 'service', {
    role: "Mappe un type de champ JSON Schema (date, enum, boolean...) vers le bon contrôle HTML via des règles ordonnées.",
    plain: "Choisit la bonne case à afficher : liste déroulante pour un choix, calendrier pour une date, case à cocher pour oui/non.",
    path: 'frontend/src/features/form-engine/register/index.js',
    notes: ['Conçu Open/Closed : ajouter un type = ajouter une règle, sans toucher au reste'],
    tag: ['all', 'overview', 'submit-flow'],
  }),
  N('api-service', 'engine', 'services/api.js', 'Client axios + endpoint employé', 510, 860, 200, 80, 'service', {
    role: "Instance axios centralisée et déclaration de l'endpoint GET employé.",
    plain: "Le petit module qui sait comment parler au serveur pour retrouver les infos d'un employé.",
    path: 'frontend/src/services/api.js',
    notes: ["baseURL = VITE_API_BASE ou '/api' (proxifié vers :8081 en dev)"],
    tag: ['all', 'employee-lookup'],
  }),
  N('definition-service-js', 'engine', 'services/definitionService.js', 'Appels DDL (table/colonnes)', 510, 960, 200, 90, 'service', {
    role: "Encapsule les appels POST/PUT vers les endpoints de définition de table (utilisé par CreateForm).",
    plain: "Le messager qui demande au serveur de créer ou modifier la structure d'une table MySQL.",
    path: 'frontend/src/services/definitionService.js',
    notes: ["N'est utilisé que par CreateForm.jsx — la page non reliée au menu"],
    tag: ['all', 'create-form'],
  }),
  N('formdata-service-js', 'engine', 'services/formDataService.js', 'Lecture/écriture/consultation + sync', 510, 1080, 200, 110, 'service', {
    role: "Point d'accès unique pour insérer, lire (liste et détail), et synchroniser les données de formulaire avec le backend.",
    plain: "Le messager principal entre le formulaire et la base de données : il envoie les réponses, liste les documents et va chercher le détail d'un document précis.",
    path: 'frontend/src/services/formDataService.js',
    notes: [
      "NOUVEAU : findById(tableName, id) → GET /api/v1/form-data/{tableName}/{id} (ligne 75-92)",
      "findById() met en minuscule toutes les clés de la réponse (ligne 89-91) — les autres méthodes ne le font pas, incohérence potentielle de casse",
      "'all()' reste un simple alias de findAll() pour compatibilité",
    ],
    tag: ['all', 'overview', 'submit-flow', 'documents-list', 'schema-sync', 'view-detail'],
    critical: true,
  }),

  // --- Server Routes -------------------------------------------------------
  N('backend-application', 'routes', 'BackEndApplication.java', 'Point d\'entrée Spring Boot', 780, 50, 180, 70, 'route', {
    role: "Démarre le contexte Spring Boot et le serveur embarqué sur le port 8081.",
    plain: "Le bouton 'marche' du serveur : c'est ce qui lance toute l'application côté back-end.",
    path: 'BackEnd/BackEnd/src/main/java/com/soummam/backend/BackEndApplication.java',
    notes: ['@SpringBootApplication déclenche le component scan de tout le package'],
    tag: ['all', 'overview'],
  }),
  N('web-config', 'routes', 'WebConfig.java', 'Configuration CORS globale', 780, 140, 180, 80, 'route', {
    role: "Déclare une politique CORS unique pour toutes les routes /api/**, évitant la duplication de @CrossOrigin.",
    plain: "Autorise le site web (sur un autre port) à parler au serveur, en ouvrant la porte à toutes les origines.",
    path: 'BackEnd/BackEnd/src/main/java/com/soummam/backend/config/WebConfig.java',
    notes: ["allowedOrigins('*') combiné à toutes les méthodes — très permissif, à restreindre en production"],

    { sev: 'low', ref: 'application.properties:4-5', t: "Identifiants MySQL désormais externalisables via DB_USERNAME/DB_PASSWORD, mais les valeurs de repli ('root' / mot de passe en clair) restent codées en dur dans le fichier versionné." },
  ],
};

// ===========================================================================
// RENDERING
// ===========================================================================
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

const colorVar = (c) => `var(--${c})`;
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

function clusterFillTint(color) {
  const map = { client: '#132233', route: '#132518', service: '#231a2c', db: '#2b230f', external: '#2b1420' };
  return map[color] || '#181818';
}

// compute canvas size from cluster extents
const CANVAS_W = Math.max(...clusters.map(c => c.x + c.w)) + 40;
const CANVAS_H = Math.max(...clusters.map(c => c.y + c.h)) + 40;
svg.setAttribute('viewBox', `0 0 ${CANVAS_W} ${CANVAS_H}`);
svg.setAttribute('width', CANVAS_W);
svg.setAttribute('height', CANVAS_H);

const layerClusters = el('g', { id: 'layer-clusters' });
const layerEdges = el('g', { id: 'layer-edges' });
const layerNodes = el('g', { id: 'layer-nodes' });
svg.appendChild(layerClusters);
svg.appendChild(layerEdges);
svg.appendChild(layerNodes);

// arrow marker defs
const defs = el('defs');
['normal', 'critical', 'api', 'db', 'mount'].forEach(kind => {
  const colorMap = { normal: '#666', critical: '#ff3860', api: '#ff9f4e', db: '#ffb86b', mount: '#4ea1ff' };
  const marker = el('marker', {
    id: `arrow-${kind}`, viewBox: '0 0 10 10', refX: '9', refY: '5',
    markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'
  });
  const path = el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: colorMap[kind] });
  marker.appendChild(path);
  defs.appendChild(marker);
});
svg.appendChild(defs);

// clusters
clusters.forEach(c => {
  const g = el('g');
  const box = el('rect', {
    x: c.x, y: c.y, width: c.w, height: c.h, class: 'cluster-box',
    fill: clusterFillTint(nodes.find(n => n.cluster === c.id)?.color), stroke: '#333'
  });
  const label = el('text', { x: c.x + 14, y: c.y + 24, class: 'cluster-label' });
  label.textContent = c.label;
  g.appendChild(box); g.appendChild(label);
  layerClusters.appendChild(g);
});

// edge path generator (cubic bezier through the horizontal gutter)
function edgePath(a, b) {
  const x1 = a.x + a.w, y1 = a.y + a.h / 2;
  const x2 = b.x, y2 = b.y + b.h / 2;
  const dx = Math.max(40, (x2 - x1) * 0.5);
  return { d: `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}
// same-column / backward edges use a horizontal loop
function edgePathLoop(a, b) {
  const x1 = a.x + a.w, y1 = a.y + a.h / 2;
  const x2 = b.x + b.w, y2 = b.y + b.h / 2;
  const bulge = 70;
  return { d: `M ${x1} ${y1} C ${x1 + bulge} ${y1}, ${x2 + bulge} ${y2}, ${x2} ${y2}`, mx: x1 + bulge, my: (y1 + y2) / 2 };
}

const edgeEls = [];
edges.forEach((e, i) => {
  const a = nodeById[e.from], b = nodeById[e.to];
  if (!a || !b) return;
  const backward = b.x < a.x;
  const { d, mx, my } = backward ? edgePathLoop(a, b) : edgePath(a, b);
  const colorMap = { normal: '#666', critical: '#ff3860', api: '#ff9f4e', db: '#ffb86b', mount: '#4ea1ff' };
  const path = el('path', {
    d, class: 'edge-path', stroke: colorMap[e.kind] || '#666',
    'stroke-width': e.kind === 'critical' ? 2 : 1.3,
    'marker-end': `url(#arrow-${e.kind})`,
  });
  layerEdges.appendChild(path);

  const label = el('text', { x: mx, y: my - 5, class: 'edge-label', 'text-anchor': 'middle' });
  label.textContent = e.label || '';
  layerEdges.appendChild(label);

  edgeEls.push({ e, path, label });
});

// nodes
const nodeEls = {};
nodes.forEach(n => {
  const g = el('g', { class: 'node-group', 'data-id': n.id });
  const rect = el('rect', {
    x: n.x, y: n.y, width: n.w, height: n.h, rx: 10,
    class: 'node-rect' + (n.critical ? ' critical' : ''),
    fill: `${colorVar(n.color)}22`, stroke: colorVar(n.color),
  });
  g.appendChild(rect);

  const label = el('text', { x: n.x + 12, y: n.y + 22, class: 'node-label' });
  label.textContent = n.label;
  g.appendChild(label);

  if (n.sub) {
    const sub = el('text', { x: n.x + 12, y: n.y + 38, class: 'node-sub' });
    sub.textContent = n.sub;
    g.appendChild(sub);
  }

  if (n.dead) {
    const dead = el('text', { x: n.x + 12, y: n.y + n.h - 10, class: 'node-dead' });
    dead.textContent = n.dead;
    g.appendChild(dead);
  }

  // badges
  const fixCount = (FIXES[n.id] || []).length;
  const bugCount = (KNOWN_BUGS[n.id] || []).length;
  let bx = n.x + n.w - 16;
  if (bugCount) {
    const bg = el('g', { class: 'badge badge-bug' });
    bg.appendChild(el('circle', { cx: bx, cy: n.y + 12, r: 9 }));
    const t = el('text', { x: bx, y: n.y + 15.5, 'text-anchor': 'middle' });
    t.textContent = bugCount;
    bg.appendChild(t);
    g.appendChild(bg);
    bx -= 22;
  }
  if (fixCount) {
    const fg = el('g', { class: 'badge badge-fix' });
    fg.appendChild(el('circle', { cx: bx, cy: n.y + 12, r: 9 }));
    const t = el('text', { x: bx, y: n.y + 15.5, 'text-anchor': 'middle' });
    t.textContent = fixCount;
    fg.appendChild(t);
    g.appendChild(fg);
  }

  layerNodes.appendChild(g);
  nodeEls[n.id] = g;

  g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
  g.addEventListener('mouseenter', () => { if (!selectedId) hoverNode(n.id); });
  g.addEventListener('mouseleave', () => { if (!selectedId) hoverNode(null); });
});

// ===========================================================================
// FILTER CHIPS
// ===========================================================================
const chipDefs = [
  { id: 'overview', label: 'Overview' },
  { id: 'submit-flow', label: 'Parcours de soumission (critique)' },
  { id: 'view-detail', label: 'Consultation lecture seule (NOUVEAU)' },
  { id: 'schema-sync', label: 'Synchro schéma → MySQL' },
  { id: 'employee-lookup', label: 'Recherche employé' },
  { id: 'documents-list', label: 'Listes de documents' },
  { id: 'create-form', label: 'Création de schéma (non liée)' },
  { id: 'all', label: 'Afficher tous les fils' },
  { id: 'roadmap-bugs', label: 'Roadmap & bugs' },
];
let activeChip = 'overview';
const chipsWrap = document.getElementById('chips');
chipDefs.forEach(c => {
  const btn = document.createElement('div');
  btn.className = 'chip' + (c.id === activeChip ? ' active' : '');
  btn.textContent = c.label;
  btn.dataset.id = c.id;
  btn.addEventListener('click', () => setActiveChip(c.id));
  chipsWrap.appendChild(btn);
});

function setActiveChip(id) {
  activeChip = id;
  [...chipsWrap.children].forEach(c => c.classList.toggle('active', c.dataset.id === id));
  applyFilter();
}

function applyFilter() {
  const tag = activeChip;
  nodes.forEach(n => {
    const g = nodeEls[n.id];
    let show;
    if (tag === 'roadmap-bugs') {
      show = !!(FIXES[n.id] || KNOWN_BUGS[n.id]);
    } else {
      show = n.tag.includes(tag);
    }
    g.classList.toggle('dimmed', !show);
  });
  edgeEls.forEach(({ e, path, label }) => {
    let show;
    if (tag === 'roadmap-bugs') {
      show = (FIXES[e.from] || KNOWN_BUGS[e.from] || FIXES[e.to] || KNOWN_BUGS[e.to]);
    } else {
      show = e.tag.includes(tag);
    }
    path.classList.toggle('dimmed', !show);
    label.classList.toggle('dimmed', !show);
  });
}
applyFilter();

// ===========================================================================
// SELECTION / SIDEBAR
// ===========================================================================
let selectedId = null;
const sidebar = document.getElementById('sidebar');

function connectedEdges(id) {
  return edges.filter(e => e.from === id || e.to === id);
}

function renderDefaultSidebar() {
  sidebar.innerHTML = `
    <h2>Vue d'ensemble</h2>
    <div class="plain-box">
      <span class="lbl">À propos</span>
      Edoc-Soummam est un moteur de génération de documents dynamiques : un schéma JSON décrit un formulaire, le frontend le rend et le valide, puis le backend crée/synchronise une table MySQL correspondante et y enregistre les réponses.
    </div>
    <div class="plain-box" style="border-color:rgba(123,211,137,0.4); background:rgba(123,211,137,0.08);">
      <span class="lbl" style="color:#7bd389;">✓ Bug de décalage table à nouveau corrigé</span>
      Le préfixage automatique <code>doc_</code> dans <code>DefinitionService</code> a été redésactivé (bloc commenté). Les noms de table DDL (créer/synchroniser) et DML (lire/écrire) sont de nouveau cohérents. Attention : le code du hack est toujours présent, juste commenté — il pourrait être réactivé par erreur.
    </div>
    <div class="plain-box" style="border-color:rgba(123,211,137,0.4); background:rgba(123,211,137,0.08);">
      <span class="lbl" style="color:#7bd389;">✓ Bug bloquant de soumission corrigé</span>
      <code>DefinitionRepository.executeCreateTable()</code> crée désormais <code>id INT AUTO_INCREMENT PRIMARY KEY</code> au lieu de <code>id INT PRIMARY KEY</code> sans valeur par défaut. C'était le principal obstacle empêchant tout INSERT dans une table de document fraîchement créée — il est levé.
    </div>
    <div class="plain-box" style="border-color:rgba(255,56,96,0.4); background:rgba(255,56,96,0.08);">
      <span class="lbl" style="color:var(--critical);">⚠️ Nouveau problème introduit</span>
      L'import mort de <code>DocumentsList</code> a été retiré de <code>App.jsx</code>, confirmant qu'aucune route <code>/documents</code> n'existe plus du tout (elle n'était déjà pas déclarée). Conséquence en cascade : le bouton "Retour" de <code>DocumentViewPage.jsx</code> qui repliait vers <code>/documents?type=...</code> atterrit maintenant sur le wildcard <code>*</code> et redirige vers le Dashboard, perdant le contexte du type de document.
    </div>
    <h3 class="section">Ce qui a changé dans cette version</h3>
    <ul class="findings" style="padding-left:18px; font-size:12.5px; color:var(--text); line-height:1.6;">
      <li><strong style="color:#7bd389;">Corrigé :</strong> <code>DefinitionRepository.executeCreateTable()</code> génère maintenant un <code>id</code> auto-incrémenté — le parcours de soumission complet (créer table → remplir formulaire → INSERT) devrait désormais fonctionner de bout en bout sur une table neuve.</li>
      <li><strong style="color:var(--critical);">Nouveau (régression mineure) :</strong> <code>DocumentsList.jsx</code> est désormais du code totalement mort — plus aucun import ni route ne le référence dans <code>App.jsx</code>, ce qui casse le repli du bouton "Retour" de la vue détail.</li>
      <li><strong>Toujours en suspens :</strong> le lien "Mes Documents" reste absent du menu, <code>proposition_promotion.json</code> reste un schéma fantôme non enregistré, la corruption d'encodage dans <code>DocumentsList.jsx</code> n'est que partiellement réparée, et le Javadoc de <code>DefinitionRepository</code> décrit toujours 4 colonnes système (dont un <code>id</code> UUID) qui ne correspondent plus au code réel.</li>
    </ul>
    <h3 class="section">Légende</h3>
    <div class="legend-row"><span class="dot" style="background:var(--client)"></span> Client / UI</div>
    <div class="legend-row"><span class="dot" style="background:var(--route)"></span> Route / Contrôleur</div>
    <div class="legend-row"><span class="dot" style="background:var(--service)"></span> Service / Logique</div>
    <div class="legend-row"><span class="dot" style="background:var(--db)"></span> Accès données</div>
    <div class="legend-row"><span class="dot" style="background:var(--external)"></span> Externe (DB, fichiers statiques)</div>
    <div class="legend-row"><span style="width:16px;height:2px;background:var(--critical);display:inline-block;"></span> Chemin critique</div>
    <p class="empty-hint" style="margin-top:14px;">Cliquez un nœud pour voir son rôle, son code, et ses connexions. Cliquez le fond pour revenir ici.</p>
  `;
}

function selectNode(id) {
  selectedId = id;
  applySelectionDimming();
  const n = nodeById[id];
  const edgesFor = connectedEdges(id);
  const incoming = edgesFor.filter(e => e.to === id);
  const outgoing = edgesFor.filter(e => e.from === id);

  const bugs = KNOWN_BUGS[id] || [];
  const fixes = FIXES[id] || [];

  sidebar.innerHTML = `
    <h2>${n.label}</h2>
    <div class="path">${n.path || ''}</div>
    <div class="role">${n.role || ''}</div>
    <div class="plain-box"><span class="lbl">En clair</span>${n.plain || ''}</div>
    ${n.notes && n.notes.length ? `<ul class="notes">${n.notes.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    ${outgoing.length ? `<h3 class="section">Sort vers (${outgoing.length})</h3>${outgoing.map(e => `
      <div class="edge-row"><span>${nodeById[e.to]?.label || e.to}</span><span class="arrow">${e.label || ''} →</span></div>`).join('')}` : ''}
    ${incoming.length ? `<h3 class="section">Reçoit de (${incoming.length})</h3>${incoming.map(e => `
      <div class="edge-row"><span class="arrow">← ${e.label || ''}</span><span>${nodeById[e.from]?.label || e.from}</span></div>`).join('')}` : ''}
    ${bugs.length ? `<h3 class="section">Bugs connus</h3>${bugs.map(b => `
      <div class="bug-row"><span class="sev sev-${b.sev}">${b.sev}</span>${b.t}${b.ref ? `<div style="color:var(--muted); margin-top:4px; font-family:monospace; font-size:10.5px;">${b.ref}</div>` : ''}</div>`).join('')}` : ''}
    ${fixes.length ? `<h3 class="section">Fixes documentés</h3>${fixes.map(f => `
      <div class="fix-row">#${f.n} — ${f.t}</div>`).join('')}` : ''}
  `;
}

function applySelectionDimming() {
  if (!selectedId) {
    Object.values(nodeEls).forEach(g => g.classList.remove('dimmed'));
    edgeEls.forEach(({ path, label }) => { path.classList.remove('dimmed'); label.classList.remove('dimmed'); });
    applyFilter();
    return;
  }
  const connected = new Set([selectedId]);
  edges.forEach(e => {
    if (e.from === selectedId) connected.add(e.to);
    if (e.to === selectedId) connected.add(e.from);
  });
  nodes.forEach(n => nodeEls[n.id].classList.toggle('dimmed', !connected.has(n.id)));
  edgeEls.forEach(({ e, path, label }) => {
    const show = e.from === selectedId || e.to === selectedId;
    path.classList.toggle('dimmed', !show);
    label.classList.toggle('dimmed', !show);
  });
}

function hoverNode(id) {
  if (!id) { applySelectionDimming(); return; }
  const connected = new Set([id]);
  edges.forEach(e => {
    if (e.from === id) connected.add(e.to);
    if (e.to === id) connected.add(e.from);
  });
  nodes.forEach(n => nodeEls[n.id].classList.toggle('dimmed', !connected.has(n.id)));
}

document.getElementById('canvas-wrap').addEventListener('click', () => {
  selectedId = null;
  applySelectionDimming();
  renderDefaultSidebar();
});
renderDefaultSidebar();

// ===========================================================================
// PAN + ZOOM
// ===========================================================================
const wrap = document.getElementById('canvas-wrap');
let scale = 1, tx = 0, ty = 0;
let isPanning = false, panStart = { x: 0, y: 0 }, txStart = 0, tyStart = 0;

function applyTransform() {
  svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  svg.style.transformOrigin = '0 0';
}

function fitToScreen() {
  const rect = wrap.getBoundingClientRect();
  const sx = rect.width / CANVAS_W, sy = rect.height / CANVAS_H;
  scale = Math.min(sx, sy) * 0.94;
  tx = (rect.width - CANVAS_W * scale) / 2;
  ty = (rect.height - CANVAS_H * scale) / 2;
  applyTransform();
}

wrap.addEventListener('mousedown', (e) => {
  isPanning = true;
  wrap.classList.add('dragging');
  panStart = { x: e.clientX, y: e.clientY };
  txStart = tx; tyStart = ty;
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  tx = txStart + (e.clientX - panStart.x);
  ty = tyStart + (e.clientY - panStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { isPanning = false; wrap.classList.remove('dragging'); });

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const worldX = (cx - tx) / scale, worldY = (cy - ty) / scale;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(3, Math.max(0.2, scale * delta));
  tx = cx - worldX * scale;
  ty = cy - worldY * scale;
  applyTransform();
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale * 1.2); applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.2, scale * 0.8); applyTransform(); });
document.getElementById('zoom-fit').addEventListener('click', fitToScreen);

window.addEventListener('resize', fitToScreen);
setTimeout(fitToScreen, 30);
</script>
